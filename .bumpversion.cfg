[bumpversion]
current_version = 0.1.0
commit = True
tag = True
tag_name = v{new_version}
message = release: v{new_version}

[bumpversion:file:internal/mcp/server.go]
search = serverVersion = "{current_version}"
replace = serverVersion = "{new_version}"

[bumpversion:file:internal/restapi/server.go]
search = apiVersion = "{current_version}"
replace = apiVersion = "{new_version}"

[bumpversion:file:server.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"
