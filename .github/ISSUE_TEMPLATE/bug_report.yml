name: Bug report
description: Something is broken or behaving incorrectly.
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Architecture / "how does X work" questions aren't bugs — see the docs
        links on the new-issue chooser. Please don't post secrets, bearer
        tokens, or proxy keys in logs.
  - type: dropdown
    id: component
    attributes:
      label: Which component?
      options:
        - mcpd (server)
        - crawler (ingest)
        - console
        - REST API
        - MCP tools
        - storage (Postgres / photo store)
        - other
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How is it deployed?
      options:
        - local docker-compose
        - Railway
        - other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger it.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant log output. This is rendered as a code block, so no backticks needed.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or `git rev-parse --short HEAD`.
    validations:
      required: true
